name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Синтаксис скриптов
        run: for f in js/*.js; do node --check "$f"; done
      - name: HTMLHint (правила из .htmlhintrc)
        run: npx -y htmlhint@1 *.html
